[package]
name = "dkls23-secp256k1"
version = "0.5.2"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "DKLs23 Threshold ECDSA — secp256k1 / Ethereum"
repository = "https://github.com/0xCarbon/DKLs23"
readme = "README.md"

[dependencies]
dkls23-core = { version = "0.5.2", path = "../dkls23-core" }
elliptic-curve = { version = "0.14.1", features = ["sec1"] }
k256 = { version = "0.14" }
sha2 = "0.11"
sha3 = "0.11"
keccak = "0.2"
ripemd = "0.2"
hex = "0.4"
bech32 = "0.11"
bs58 = "0.5"

[dev-dependencies]
group = "0.14"

[features]
default = ["serde"]
serde = ["dkls23-core/serde", "k256/serde"]
insecure-rng = ["dkls23-core/insecure-rng"]
