[package]
name = "dkls23"
version = "0.6.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
description = "DKLs23 Threshold ECDSA — umbrella crate for dkls23-core and its curve instantiations"
repository = "https://github.com/0xCarbon/DKLs23"
readme = "README.md"

[dependencies]
dkls23-core = { version = "0.6.2", path = "../dkls23-core", default-features = false }
dkls23-secp256k1 = { version = "0.6.2", path = "../dkls23-secp256k1", default-features = false, optional = true }
dkls23-secp256r1 = { version = "0.6.2", path = "../dkls23-secp256r1", default-features = false, optional = true }

[dev-dependencies]
dkls23-secp256k1 = { version = "0.6.2", path = "../dkls23-secp256k1" }
dkls23-secp256r1 = { version = "0.6.2", path = "../dkls23-secp256r1" }
k256 = "0.14"
p256 = "0.14"

[features]
default = ["secp256k1", "serde"]
secp256k1 = ["dep:dkls23-secp256k1"]
secp256r1 = ["dep:dkls23-secp256r1"]
serde = ["dkls23-core/serde", "dkls23-secp256k1?/serde", "dkls23-secp256r1?/serde"]
insecure-rng = [
    "dkls23-core/insecure-rng",
    "dkls23-secp256k1?/insecure-rng",
    "dkls23-secp256r1?/insecure-rng",
]

[package.metadata.docs.rs]
all-features = true
