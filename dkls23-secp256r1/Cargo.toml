[package]
name = "dkls23-secp256r1"
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
description = "DKLs23 Threshold ECDSA — secp256r1 / NEO3"
repository = "https://github.com/0xCarbon/DKLs23"
readme = "README.md"

[dependencies]
dkls23-core = { version = "0.6.1", path = "../dkls23-core", default-features = false }
elliptic-curve = { version = "0.14.1", features = ["sec1"] }
p256 = { version = "0.14", features = ["group-digest"] }
ripemd = "0.2"
sha2 = "0.11"
blake2 = "0.11"
bs58 = "0.5"
hex = "0.4"

[dev-dependencies]
group = { version = "0.14", default-features = false }

[features]
default = ["serde"]
serde = ["dkls23-core/serde", "p256/serde"]
insecure-rng = ["dkls23-core/insecure-rng"]
