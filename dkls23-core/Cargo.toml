[package]
name = "dkls23-core"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "DKLs23 Threshold ECDSA — curve-generic core"
repository = "https://github.com/0xCarbon/DKLs23"
readme = "README.md"

[dependencies]
elliptic-curve = { version = "0.14.1", features = ["arithmetic", "sec1"] }
ff = { version = "0.14", default-features = false }
group = { version = "0.14", default-features = false }
hash2curve = "0.14"
sha2 = "0.11"
hmac = "0.13"
ripemd = "0.2"
rand = "0.10"
hex = "0.4"
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.12", optional = true }
zeroize = { version = "1", features = ["derive"] }
subtle = "2.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[dev-dependencies]
k256 = { version = "0.14", features = ["group-digest", "serde"] }
p256 = { version = "0.14", features = ["group-digest"] }
serde_json = "1"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_bytes", "dep:postcard"]
insecure-rng = []
